:root {
  --ink: #1A1A1A;
  --blue: #4472C4;
  --dblue: #2F5597;
  --outline: #B4BCC8;
  --wire: #8E9BB0;
  --changed: #FFFAEB;
  --input-tint: #E8EFFB;
  --input-line: #A9C1EA;
  --flow: #2F5597;
  --fixed: #C55A11;
  --vc: #3F7A25;
  --ic: #7030A0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #FFFFFF; color: var(--ink);
  font-family: "Plex Embedded", "IBM Plex Sans", system-ui, sans-serif; }

#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 22px 32px 24px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 40px; height: 64px; }
h1 { margin: 0; font-size: 36px; font-weight: 600; color: var(--blue); white-space: nowrap; }
.presets { display: flex; gap: 12px; }
.presets button { font: inherit; font-size: 21px; font-weight: 600; color: var(--dblue); background: #FFFFFF;
  border: 2px solid var(--blue); border-radius: 999px; padding: 7px 20px; cursor: pointer; white-space: nowrap; }
.presets button:hover { background: #EEF3FB; }
.presets button.active { background: var(--blue); color: #FFFFFF; }

.tree { position: relative; margin-top: 26px; }
.tree svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#sub { margin-top: 30px; }
.rule { height: 2px; background: #DCE3EE; margin-top: 28px; }

.node { position: absolute; display: flex; align-items: center; justify-content: space-between; gap: 18px;
  height: 46px; padding: 0 14px; border: 2px solid var(--outline); border-radius: 8px; background: #FFFFFF;
  font-size: 21px; white-space: nowrap; }
.node .val { font-weight: 600; font-variant-numeric: tabular-nums; }
.node .dir { display: inline-block; width: 0.6em; margin-right: 0.15em; color: var(--dblue); visibility: hidden; }
.node.changed { background: var(--changed); }
.node.changed .dir { visibility: visible; }
.node.const { justify-content: center; font-weight: 600; }

.node.root { height: 104px; min-width: 340px; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
  border: 3px solid var(--blue); padding: 0 20px; }
.node.root .lbl { font-size: 26px; font-weight: 600; color: var(--blue); }
.node.root .val { font-size: 38px; }
.node.root .was { font-weight: 400; }

.node.link { border-color: var(--role); cursor: pointer; }
.node.link .lbl { color: var(--role); font-weight: 600; }
.node.link:not(.changed):not(.open) { background: var(--tint); }
.node.link:not(.open):hover { background: var(--tint2); }
.node.input { cursor: text; border-color: var(--input-line); }
.node.input:not(.changed) { background: var(--input-tint); }
.node.input:hover { border-color: var(--blue); }
.node.open, .node.subroot { background: var(--role); border-color: var(--role); color: #FFFFFF; }
.node.open .lbl, .node.subroot .lbl, .node.open .dir, .node.subroot .dir { color: #FFFFFF; }
.node.subroot { cursor: default; }
.role-flow { --role: var(--flow); --tint: #E6EBF2; --tint2: #CDD6E6; }
.role-fixed { --role: var(--fixed); --tint: #F8EBE2; --tint2: #F1D7C6; }
.role-vc { --role: var(--vc); --tint: #E8EFE5; --tint2: #D1DFCB; }
.role-ic { --role: var(--ic); --tint: #EEE6F4; --tint2: #DDCDE8; }

.ctl { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.ctl input { font: inherit; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink);
  height: 34px; padding: 0 6px; border: 2px solid var(--blue); border-radius: 6px; background: #FFFFFF; -moz-appearance: textfield; }
.ctl input::-webkit-outer-spin-button, .ctl input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.ctl input:focus { outline: 3px solid #A9C1EA; outline-offset: 0; }
.ctl input.bad { border-color: #C00000; }

.op { position: absolute; display: flex; align-items: center; justify-content: center; height: 36px; min-width: 36px;
  padding: 0 7px; border: 2px solid var(--blue); border-radius: 999px; background: #FFFFFF; color: var(--dblue);
  font-size: 27px; font-weight: 600; line-height: 1; }
.op.word { font-size: 19px; }

/* a change ripples from the edited field up to ROIC */
.flash { fill: none; stroke: var(--blue); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 1; stroke-dashoffset: 1; animation: flash 900ms ease-out both; }
@keyframes flash {
  0%   { stroke-dashoffset: 1; opacity: 0.9; }
  18%  { stroke-dashoffset: 0; opacity: 0.9; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
.node.pulse { animation: pulse 900ms ease-out both; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(68, 114, 196, 0.45); }
  100% { box-shadow: 0 0 0 10px rgba(68, 114, 196, 0); }
}
@media (prefers-reduced-motion: reduce) {
  .flash { display: none; }
  .node.pulse { animation: none; }
}
</style>
</head>

  finishing:      { label: "Finishing",        base: 60,   step: 10,  pre: "$", post: "K",     w: 4 },
  rent:           { label: "Rent",             base: 150,  step: 10,  pre: "$", post: "K",     w: 4 },
  depreciation:   { label: "Depreciation",     base: 80,   step: 10,  pre: "$", post: "K",     w: 4 },
  woodInTable:    { label: "Wood in a table",  base: 30,   step: 1,   pre: "",  post: "kg",    w: 3 },
  scrap:          { label: "Scrap rate",       base: 25,   step: 5,   pre: "",  post: "%",     w: 3 },
  woodPrice:      { label: "Wood price",       base: 10,   step: 1,   pre: "$", post: "/kg",   w: 3 },
  ppe:            { label: "PP&E",             base: 450,  step: 10,  pre: "$", post: "K",     w: 4 },
  rawMat:         { label: "Raw materials",    base: 20,   step: 5,   pre: "$", post: "K",     w: 4 },
  wip:            { label: "Work-in-process",  base: 50,   step: 5,   pre: "$", post: "K",     w: 4 },
  prepayMonths:   { label: "Time paid ahead",  base: 1,    step: 1,   pre: "",  post: "mo",    w: 3 },
  downPct:        { label: "Down payment",     base: 50,   step: 5,   pre: "",  post: "%",     w: 3, max: 100 },
  deliveryMonths: { label: "Time to delivery", base: 3,    step: 1,   pre: "",  post: "mo",    w: 3 },
};
const BASE = Object.fromEntries(Object.entries(PARAMS).map(([k, p]) => [k, p.base]));
const PRESETS = {
  base:  { vals: {},              view: null },
  setup: { vals: { setup: 10 },   view: "flow" },
  wage:  { vals: { wage: 19 },    view: "fixed" },
  rent:  { vals: { rent: 140 },   view: "fixed" },
};
let vals = { ...BASE };

// ---------- model ----------
function compute(v) {
  const r = {};
  r.availHours = v.workers * v.days * v.hoursPerDay;
  r.productive = 1 - v.setup / 100 - v.wait / 100;
  r.hoursPerTable = r.productive > 0 ? v.procTime / r.productive : Infinity;
  r.capacity = r.availHours / r.hoursPerTable;
  r.flow = Math.min(v.demand, r.capacity);
  r.revenue = r.flow * v.price;
  r.directLabor = r.availHours * v.wage;
  r.marketing = v.marketing * 1000;
  r.indirect = (v.management + v.finishing) * 1000;
  r.overhead = (v.rent + v.depreciation) * 1000;
  r.fixed = r.directLabor + r.marketing + r.indirect + r.overhead;
  r.scrapFactor = 1 + v.scrap / 100;
  r.woodBought = v.woodInTable * r.scrapFactor;
  r.vc = r.woodBought * v.woodPrice;
  r.price = v.price;
  r.fcShare = r.fixed / r.revenue;
  r.vcShare = r.vc / v.price;
  r.margin = 1 - r.fcShare - r.vcShare;
  r.inventory = (v.rawMat + v.wip) * 1000;
  r.woodSpend = r.flow * r.vc;
  r.prepay = r.woodSpend * v.prepayMonths / 12;
  r.assets = v.ppe * 1000 + r.inventory + r.prepay;
  r.unearned = r.revenue * v.downPct / 100 * v.deliveryMonths / 12;
  r.ic = r.assets - r.unearned;
  r.turns = r.ic > 0 ? r.revenue / r.ic : NaN;
  r.roic = r.margin * r.turns;
  return r;
}

// ---------- formatting ----------
const MINUS = "−";
const num = (x, d = 1) => Math.abs(x).toLocaleString("en-US", { maximumFractionDigits: d });
const sign = x => (x < 0 ? MINUS : "");
const ok = x => Number.isFinite(x);
const F = {
  pct:   x => ok(x) ? sign(x) + num(x * 100, 1) + "%" : "—",
  pctFixed: x => ok(x) ? sign(x) + Math.abs(x * 100).toFixed(1) + "%" : "—",
  kusd:  x => ok(x) ? sign(x) + "$" + num(x / 1000, 1) + "K" : "—",
  kusdYr: x => ok(x) ? sign(x) + "$" + num(x / 1000, 1) + "K/yr" : "—",
  usd:   x => ok(x) ? sign(x) + "$" + num(x, 0) : "—",
  perYr: x => ok(x) ? num(x, 1) + "/yr" : "—",
  hours: x => ok(x) ? num(x, 1) + " h" : "—",
  kg:    x => ok(x) ? num(x, 1) + " kg" : "—",
  turns: x => ok(x) ? sign(x) + Math.abs(x).toFixed(2) : "—",
};

// ---------- trees ----------
const C100 = { konst: "100%" };
const inp = k => ({ input: k });
const TOP = {
  label: "ROIC", key: "roic", fmt: "pctFixed", op: "×", root: true, children: [
    { label: "Margin", key: "margin", fmt: "pctFixed", op: MINUS, children: [
      C100,
      { label: "Fixed costs ÷ Revenue", key: "fcShare", fmt: "pctFixed", op: "÷", children: [
        { label: "Fixed costs", key: "fixed", fmt: "kusd", link: "fixed" },
        { label: "Revenue", key: "revenue", fmt: "kusd", op: "×", children: [
          { label: "Flow rate", key: "flow", fmt: "perYr", link: "flow" },
          inp("price"),
        ] },
      ] },
      { label: "Variable cost ÷ Price", key: "vcShare", fmt: "pctFixed", op: "÷", children: [
        { label: "Variable cost per table", key: "vc", fmt: "usd", link: "vc" },
        { label: "Price", key: "price", fmt: "usd" },
      ] },
    ] },
    { label: "Asset turns", key: "turns", fmt: "turns", op: "÷", children: [
      { label: "Revenue", key: "revenue", fmt: "kusd" },
      { label: "Invested capital", key: "ic", fmt: "kusd", link: "ic" },
    ] },
  ] };

const SUB = {
  flow: { label: "Flow rate", key: "flow", fmt: "perYr", role: "flow", op: "min", children: [
    inp("demand"),
    { label: "Capacity", key: "capacity", fmt: "perYr", op: "÷", children: [
      { label: "Available hours", key: "availHours", fmt: "hours", op: "×", children: [
        inp("workers"), inp("days"), inp("hoursPerDay") ] },
      { label: "Hours per table", key: "hoursPerTable", fmt: "hours", op: "÷", children: [
        inp("procTime"),
        { label: "Productive time", key: "productive", fmt: "pct", op: MINUS, children: [ C100, inp("setup"), inp("wait") ] },
      ] },
    ] },
  ] },
  fixed: { label: "Fixed costs", key: "fixed", fmt: "kusd", role: "fixed", op: "+", children: [
    { label: "Direct labor", key: "directLabor", fmt: "kusd", op: "×", children: [
      { label: "Available hours", key: "availHours", fmt: "hours", link: "flow" }, inp("wage") ] },
    inp("marketing"),
    { label: "Indirect labor", key: "indirect", fmt: "kusd", op: "+", children: [ inp("management"), inp("finishing") ] },
    { label: "Other overhead", key: "overhead", fmt: "kusd", op: "+", children: [ inp("rent"), inp("depreciation") ] },
  ] },
  vc: { label: "Variable cost per table", key: "vc", fmt: "usd", role: "vc", op: "×", children: [
    { label: "Wood bought per table", key: "woodBought", fmt: "kg", op: "×", children: [
      inp("woodInTable"),
      { label: "1 + scrap rate", key: "scrapFactor", fmt: "pct", op: "+", children: [ C100, inp("scrap") ] },
    ] },
    inp("woodPrice"),
  ] },
  ic: { label: "Invested capital", key: "ic", fmt: "kusd", role: "ic", op: MINUS, children: [
    { label: "Assets", key: "assets", fmt: "kusd", op: "+", children: [
      inp("ppe"),
      { label: "Inventory", key: "inventory", fmt: "kusd", op: "+", children: [ inp("rawMat"), inp("wip") ] },
      { label: "Prepayments", key: "prepay", fmt: "kusd", op: "×", children: [
        { label: "Wood spend", key: "woodSpend", fmt: "kusdYr", op: "×", children: [
          { label: "Flow rate", key: "flow", fmt: "perYr", link: "flow" },
          { label: "Variable cost per table", key: "vc", fmt: "usd", link: "vc" },
        ] },
        inp("prepayMonths"),
      ] },
    ] },
    { label: "Unearned revenue", key: "unearned", fmt: "kusd", op: "×", children: [
      { label: "Revenue", key: "revenue", fmt: "kusd" }, inp("downPct"), inp("deliveryMonths") ] },
  ] },
};

// ---------- rendering ----------
const PITCH = 54, GAP = 70;
const baseRes = compute(BASE);
let res = baseRes;
let view = "flow";
const inputs = {};          // param key -> <input>
const trees = {};           // container id -> laid-out tree

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function makeNode(def, ctx) {
  let n;
  if (def.konst) {
    n = el("div", "node const", def.konst);
  } else if (def.input) {
    const p = PARAMS[def.input];
    n = el("div", "node input");
    const id = "in-" + def.input;
    const lbl = el("label", "lbl", p.label);
    lbl.htmlFor = id;
    const ctl = el("span", "ctl");
    if (p.pre) ctl.append(p.pre);
    const box = document.createElement("input");
    Object.assign(box, { id, type: "number", step: p.step, min: 0, value: vals[def.input] });
    if (p.max !== undefined) box.max = p.max;
    box.style.width = (p.w + 1.2) + "ch";
    box.addEventListener("input", () => {
      const x = parseFloat(box.value);
      const bad = !Number.isFinite(x) || x < 0 || (p.max !== undefined && x > p.max);
      box.classList.toggle("bad", bad);
      if (bad) return;
      vals[def.input] = x;
      update();
    });
    ctl.append(box);
    if (p.post) ctl.append(p.post);
    n.append(lbl, ctl);
    n.addEventListener("click", e => { if (e.target !== box) box.focus(); });
    inputs[def.input] = box;
  } else {
    n = el("div", "node");
    if (def.root) n.classList.add("root");
    const v = el("span", "val");
    if (!def.root) v.append(el("span", "dir"));
    v.append(el("span", "num"));
    n.append(el("span", "lbl", def.label), v);
    const role = def.role || def.link;
    if (role) n.classList.add("role-" + role);
    if (def.role) n.classList.add("subroot");
    if (def.link && !ctx.isSubRoot) {
      n.classList.add("link");
      n.addEventListener("click", () => { if (view !== def.link) { view = def.link; renderSub(); update(); } });
    }
  }
  return n;
}

function build(container, def) {
  container.textContent = "";
  for (const k in inputs) if (!document.body.contains(inputs[k])) delete inputs[k];
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  container.append(svg);
  const items = [];
  (function walk(d, depth, parent) {
    const item = { def: d, depth, parent, kids: [], el: makeNode(d, { isSubRoot: parent === null && !!d.role }) };
    container.append(item.el);
    if (d.op && d.children) {
      item.opEl = el("div", "op" + (d.op.length > 1 ? " word" : ""), d.op);
      container.append(item.opEl);
    }
    items.push(item);
    if (parent) parent.kids.push(item);
    (d.children || []).forEach(c => walk(c, depth + 1, item));
  })(def, 0, null);
  return { container, svg, items, root: items[0], colW: [] };
}

function refresh(tree) {
  for (const it of tree.items) {
    const d = it.def;
    if (d.input) {
      const box = inputs[d.input];
      if (document.activeElement !== box && parseFloat(box.value) !== vals[d.input]) box.value = vals[d.input];
      it.el.classList.toggle("changed", vals[d.input] !== BASE[d.input]);
      continue;
    }
    if (!d.key) continue;
    const now = res[d.key], was = baseRes[d.key];
    const unchanged = same(now, was);
    it.el.classList.toggle("changed", !unchanged);
    it.el.classList.toggle("open", !!d.link && d.link === view);
    const numEl = it.el.querySelector(".num");
    if (d.root) {
      numEl.textContent = "";
      if (!unchanged) numEl.append(el("span", "was", F[d.fmt](was) + " → "));
      numEl.append(F[d.fmt](now));
    } else {
      numEl.textContent = F[d.fmt](now);
      it.el.querySelector(".dir").textContent = !unchanged && Number.isFinite(now) && Number.isFinite(was) ? (now > was ? "↑" : "↓") : "";
    }
    it.el.title = unchanged ? "" : "Base case: " + F[d.fmt](was);
  }
}

function layout(tree) {
  const { items, svg } = tree;
  // column widths only grow while values change, so the tree does not shift under the cursor
  const colW = tree.colW;
  for (const it of items) { it.el.style.width = ""; }
  for (const it of items) {
    if (it.def.konst) continue;
    colW[it.depth] = Math.max(colW[it.depth] || 0, it.el.offsetWidth);
  }
  for (let d = 0; d < colW.length; d++) colW[d] = colW[d] || 0;
  const colX = [];
  colW.reduce((x, w, d) => (colX[d] = x, x + w + GAP), 0);
  let row = 0;
  (function place(it) {
    if (!it.kids.length) { it.y = row * PITCH + PITCH / 2; row++; return; }
    it.kids.forEach(place);
    it.y = (it.kids[0].y + it.kids[it.kids.length - 1].y) / 2;
  })(tree.root);
  const height = row * PITCH;
  let width = 0;
  for (const it of items) {
    const w = it.def.konst ? it.el.offsetWidth : colW[it.depth];
    if (!it.def.konst) it.el.style.width = w + "px";
    const h = it.el.offsetHeight;
    it.x = colX[it.depth];
    it.el.style.left = it.x + "px";
    it.el.style.top = (it.y - h / 2) + "px";
    width = Math.max(width, it.x + w);
  }
  // connectors and operators
  let paths = "";
  tree.edges = [];
  for (const it of items) {
    if (!it.kids.length) continue;
    const px = colX[it.depth] + colW[it.depth], ox = px + GAP / 2, cx = colX[it.depth + 1];
    paths += `<path d="M${px},${it.y}H${ox}"/>`;
    let binding = -1;
    if (it.def.op === "min") {
      const v = it.kids.map(k => (k.def.input ? vals[k.def.input] : res[k.def.key]));
      binding = v.indexOf(Math.min(...v));
    }
    it.kids.forEach((k, i) => {
      const dash = binding >= 0 && i !== binding ? ' stroke-dasharray="7 6"' : "";
      paths += `<path d="M${ox},${it.y}V${k.y}H${cx}"${dash}/>`;
      tree.edges.push({ parent: it, child: k, d: `M${cx},${k.y}H${ox}V${it.y}H${px}` });
    });
    const o = it.opEl, ow = o.offsetWidth, oh = o.offsetHeight;
    o.style.left = (ox - ow / 2) + "px";
    o.style.top = (it.y - oh / 2) + "px";
  }
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.innerHTML = `<g fill="none" stroke="var(--wire)" stroke-width="2">${paths}</g>`;
  tree.container.style.width = width + "px";
  tree.container.style.height = height + "px";
}

function renderSub() {
  trees.sub = build(document.getElementById("sub"), SUB[view]);
}

// ---------- fitting the stage to the window ----------
const stage = document.getElementById("stage");
let floorW = 0, floorH = 0;
function fit() {
  stage.style.transform = "none";
  stage.style.width = "max-content";
  floorW = Math.max(floorW, stage.offsetWidth);
  floorH = Math.max(floorH, stage.offsetHeight);
  stage.style.width = floorW + "px";
  const s = Math.min(innerWidth / floorW, innerHeight / floorH);
  const left = Math.max(0, (innerWidth - floorW * s) / 2);
  stage.style.transform = `translate(${left}px, 0) scale(${s})`;
}

const STEP = 120;   // ms per tree level
const same = (a, b) => (Number.isFinite(a) && Number.isFinite(b))
  ? Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(b)) : String(a) === String(b);
let prevVals = { ...vals }, prevRes = res;

// Light up the wires between nodes whose values just changed, deepest level first; return when the ripple reaches the root.
function ripple(tree, keys, edited, start) {
  const hit = it => it.def.input ? edited.has(it.def.input) : !!it.def.key && keys.has(it.def.key);
  const nodes = tree.items.filter(hit);
  if (!nodes.length) return start;
  const deepest = Math.max(...nodes.map(it => it.depth));
  const at = depth => start + (deepest - depth) * STEP;
  const paths = tree.edges.filter(e => hit(e.child) && hit(e.parent))
    .map(e => `<path class="flash" pathLength="1" style="animation-delay:${at(e.child.depth)}ms" d="${e.d}"/>`);
  tree.svg.insertAdjacentHTML("beforeend", `<g>${paths.join("")}</g>`);
  for (const it of nodes) {
    it.el.classList.remove("pulse");
    void it.el.offsetWidth;
    it.el.style.animationDelay = at(it.depth) + "ms";
    it.el.classList.add("pulse");
  }
  return at(Math.min(...nodes.map(it => it.depth))) + STEP;
}

function update() {
  res = compute(vals);
  for (const t of Object.values(trees)) { refresh(t); layout(t); }
  const keys = new Set(Object.keys(res).filter(k => !same(res[k], prevRes[k])));
  const edited = new Set(Object.keys(vals).filter(k => vals[k] !== prevVals[k]));
  if (keys.size || edited.size) {
    const inTop = trees.top.items.some(it => it.def.input && edited.has(it.def.input));
    const order = inTop ? [trees.top, trees.sub] : [trees.sub, trees.top];
    order.reduce((t0, t) => ripple(t, keys, edited, t0), 0);
  }
  prevVals = { ...vals };
  prevRes = res;
  for (const b of document.querySelectorAll(".presets button")) {
    const target = { ...BASE, ...PRESETS[b.dataset.preset].vals };
    b.classList.toggle("active", Object.keys(BASE).every(k => vals[k] === target[k]));
  }
  fit();
}

document.querySelectorAll(".presets button").forEach(b => b.addEventListener("click", () => {
  const p = PRESETS[b.dataset.preset];
  vals = { ...BASE, ...p.vals };
  for (const t of Object.values(trees)) t.colW = [];
  if (p.view && p.view !== view) { view = p.view; renderSub(); }
  update();
}));
addEventListener("resize", fit);

function init() {
  trees.top = build(document.getElementById("top"), TOP);
  // size the stage for the largest sub-tree so that switching trees does not rescale the page
  for (const v of ["fixed", "vc", "ic", "flow"]) { view = v; renderSub(); update(); }
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(init);
</script>
</body>
</html>
