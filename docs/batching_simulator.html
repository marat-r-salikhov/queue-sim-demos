:root {
  --ink: #1A1A1A;
  --blue: #4472C4;
  --dblue: #2F5597;
  --outline: #B4BCC8;
  --wire: #8E9BB0;
  --rule: #DCE3EE;
  --changed: #FFFAEB;
  --input-tint: #E8EFFB;
  --input-line: #A9C1EA;
  --setup: #C55A11;
  --setup-tint: #F8E3D3;
  --proc-tint: #D6E1F5;
  --idle: #EEF1F5;
  --emph: #E2F0D9;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #FFFFFF; color: var(--ink);
  font-family: "Plex Embedded", "IBM Plex Sans", system-ui, sans-serif; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 1600px; padding: 22px 32px 24px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 32px; height: 64px; }
h1 { margin: 0; font-size: 36px; font-weight: 600; color: var(--blue); white-space: nowrap; }
.run { display: flex; align-items: center; gap: 12px; }
.clock { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 120px; text-align: right; margin-right: 6px; }
.pill { font: inherit; font-size: 21px; font-weight: 600; color: var(--dblue); background: #FFFFFF;
  border: 2px solid var(--blue); border-radius: 999px; padding: 7px 20px; cursor: pointer; white-space: nowrap; }
.pill:hover { background: #EEF3FB; }
.pill.active, .pill.primary { background: var(--blue); color: #FFFFFF; }
.pill.primary { min-width: 112px; }
select.pill { padding-right: 14px; }

.params { display: flex; align-items: center; gap: 28px; margin-top: 18px; }
.seg { display: flex; gap: 10px; }

.field { display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; height: 46px; padding: 0 12px 0 14px;
  border: 2px solid var(--input-line); border-radius: 8px; background: var(--input-tint); font-size: 21px; white-space: nowrap; cursor: text; }
.field:hover { border-color: var(--blue); }
.field.changed { background: var(--changed); }
.field .ctl { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.field input { font: inherit; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink);
  height: 34px; padding: 0 6px; border: 2px solid var(--blue); border-radius: 6px; background: #FFFFFF; -moz-appearance: textfield; }
.field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.field input:focus { outline: 3px solid var(--input-line); outline-offset: 0; }
.field input.bad { border-color: #C00000; }
.field.big { height: 52px; font-size: 23px; }

.flow { position: relative; margin-top: 18px; height: 384px; }
.flow svg { position: absolute; left: 0; top: 0; overflow: visible; }
.flow .inputs { position: absolute; display: flex; flex-direction: column; gap: 8px; }
.flow .inputs .field { width: 100%; }

.mach { fill: #FFFFFF; stroke: var(--outline); stroke-width: 2; }
.mach.setup { fill: #FFF6EF; stroke: var(--setup); }
.mach.processing { fill: #F2F6FC; stroke: var(--blue); }
.mach.bottleneck { stroke-width: 4; }
.mname { font-size: 25px; font-weight: 600; fill: var(--ink); }
.mstate { font-size: 21px; fill: var(--ink); font-variant-numeric: tabular-nums; }
.mstate.setup { fill: var(--setup); font-weight: 600; }
.mstate.processing { fill: var(--dblue); font-weight: 600; }
.mcap { font-size: 21px; font-weight: 600; fill: var(--dblue); font-variant-numeric: tabular-nums; }
.wire { stroke: var(--wire); stroke-width: 2.5; fill: none; }
.buf { fill: #FFFFFF; stroke: var(--wire); stroke-width: 2.5; stroke-linejoin: round; }
.bufn { font-size: 22px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
.side { font-size: 21px; fill: var(--ink); }
.siden { font-size: 26px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
.pulse rect { fill: var(--blue); }
.pulse text { font-size: 17px; font-weight: 600; fill: #FFFFFF; font-variant-numeric: tabular-nums; }

.lower { display: grid; grid-template-columns: 960px 1fr; gap: 36px; margin-top: 22px; align-items: start; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 8px; }
.block-head h2 { margin: 0; font-size: 23px; font-weight: 600; color: var(--dblue); }
.legend { display: flex; gap: 18px; font-size: 19px; align-items: center; }
.legend i { display: inline-block; width: 26px; height: 14px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }

table { border-collapse: collapse; width: 100%; font-size: 20px; font-variant-numeric: tabular-nums; }
th { background: var(--blue); color: #FFFFFF; font-weight: 600; text-align: left; padding: 7px 12px; border: 1px solid #FFFFFF; }
td { padding: 7px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th.num, td.num { text-align: right; }
tr.bn td { background: var(--emph); font-weight: 600; }
tr.total td { font-weight: 600; border-bottom: none; }

canvas { display: block; }
#gantt { margin-top: 2px; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <h1>JCL Inc.: batching on a three-step line</h1>
    <div class="run">
      <span class="clock" id="clock">0.0 h</span>
      <button class="pill primary" id="play">Start</button>
      <button class="pill" id="reset">Reset</button>
      <button class="pill" id="day">+1 day</button>
      <select class="pill" id="speed" aria-label="Simulation speed">
        <option value="10">10 min/s</option>
        <option value="30" selected>30 min/s</option>
        <option value="60">60 min/s</option>
        <option value="180">3 h/s</option>
      </select>
    </div>
  </header>

  <div class="params">
    <label class="field big" id="f-B"><span>Batch size</span><span class="ctl"><input id="in-B" type="text" inputmode="numeric" data-step="10" style="width:6ch">wafers</span></label>
    <div class="seg">
      <button class="pill" data-tech="old">Current depositing</button>
      <button class="pill" data-tech="new">New depositing technology</button>
    </div>
  </div>

  <section class="flow" id="flow"></section>

  <section class="lower">
    <div>
      <div class="block-head"><h2>Target and actual throughput, wafers per hour</h2></div>
      <table>
        <thead><tr><th>Step</th><th>Target = 60 × B / (S + B × p)</th><th class="num">Actual, since the step’s<br>first finished batch</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div>
      <div class="block-head"><h2>Wafers waiting in front of</h2>
        <div class="legend"><span><i style="background:var(--blue)"></i>patterning</span><span><i style="background:#3F7A25"></i>etching</span></div></div>
      <canvas id="chart" width="540" height="236"></canvas>
    </div>
  </section>

  <section style="margin-top:20px">
    <div class="block-head"><h2>What each machine did in the last 8 hours</h2>
      <div class="legend"><span><i style="background:var(--setup)"></i>setup</span><span><i style="background:var(--blue)"></i>processing</span><span><i style="background:var(--idle);border:1px solid var(--outline)"></i>idle</span></div></div>
    <canvas id="gantt" width="1536" height="150"></canvas>
  </section>
</div>

<script>
"use strict";
// ==SIM-CORE-START==
const STEPS = ["Depositing", "Patterning", "Etching"];
const BASE = { B: 100, S: [45, 30, 20], p: [0.15, 0.25, 0.20] };
const NEW_DEP = { S: 0, p: 0.45 };

// Capacity of a batched step in wafers per hour: 60 B / (S + B p).
function analytic(par) {
  const cap = par.S.map((s, j) => 60 * par.B / (s + par.B * par.p[j]));
  const rate = Math.min(...cap);
  const bottleneck = cap.map(c => c <= rate * (1 + 1e-9));
  return { cap, rate, bottleneck, busy: cap.map(c => rate / c) };
}

// Event-driven line: whole batches of B wafers move between steps; buffers are unlimited and raw wafers
// are always available, so depositing starts a new batch as soon as it finishes one.
class Line {
  constructor(par, onMove) {
    this.par = par; this.onMove = onMove || (() => {});
    this.t = 0; this.nextId = 1; this.done = 0;
    this.count = [0, 0, 0]; this.first = [null, null, null]; this.last = [null, null, null];
    this.m = STEPS.map(() => ({ busy: false }));
    this.q = [[], []];
    this.setupDone = [0, 0, 0]; this.procDone = [0, 0, 0];
    this.segs = [[], [], []];
    this.start(0, this.nextId++, 0);
  }
  start(j, id, t) {
    const S = this.par.S[j], P = this.par.B * this.par.p[j];
    this.m[j] = { busy: true, id, start: t, setupEnd: t + S, end: t + S + P };
    if (S > 0) this.segs[j].push({ kind: "setup", a: t, b: t + S });
    this.segs[j].push({ kind: "proc", a: t + S, b: t + S + P });
  }
  finish(j, t) {
    const mj = this.m[j];
    this.setupDone[j] += mj.setupEnd - mj.start;
    this.procDone[j] += mj.end - mj.setupEnd;
    this.m[j] = { busy: false };
    this.count[j]++; if (this.first[j] === null) this.first[j] = t; this.last[j] = t;
    if (j < 2) this.q[j].push(mj.id); else this.done++;
    this.onMove(j, "out", mj.id);
  }
  fill(t) {
    for (let j = 2; j >= 1; j--) {
      if (!this.m[j].busy && this.q[j - 1].length) { const id = this.q[j - 1].shift(); this.start(j, id, t); this.onMove(j, "in", id); }
    }
    if (!this.m[0].busy) this.start(0, this.nextId++, t);
  }
  advance(target) {
    let guard = 0;
    while (true) {
      const next = Math.min(...this.m.map(x => (x.busy ? x.end : Infinity)));
      if (!(next <= target)) break;
      for (let j = 2; j >= 0; j--) if (this.m[j].busy && this.m[j].end <= next + 1e-9) this.finish(j, next);
      this.t = next;
      this.fill(next);
      if (++guard > 200000) throw new Error("event limit");
    }
    this.t = target;
  }
  busyTime(j) {
    const x = this.m[j];
    let s = this.setupDone[j], p = this.procDone[j];
    if (x.busy) { s += Math.min(this.t, x.setupEnd) - x.start; p += Math.max(0, this.t - x.setupEnd); }
    return { setup: s, proc: p };
  }
  utilisation(j) { const b = this.busyTime(j); return this.t > 0 ? (b.setup + b.proc) / this.t : NaN; }
  // Actual throughput of step j: wafers finished between its first and its latest finished batch, per hour.
  actual(j) { return this.count[j] >= 2 ? 60 * this.par.B * (this.count[j] - 1) / (this.last[j] - this.first[j]) : NaN; }
  waiting(k) { return this.q[k].length * this.par.B; }
  prune(from) { for (const s of this.segs) while (s.length && s[0].b < from) s.shift(); }
}
// ==SIM-CORE-END==

const $ = id => document.getElementById(id);
const fmt = (x, d = 1) => Number.isFinite(x) ? x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : "—";
const pct = x => Number.isFinite(x) ? fmt(100 * x, 1) + "%" : "\u2014";
const short = x => Number.isFinite(x) ? String(+x.toFixed(3)) : "—";
let par = clone(BASE);
function clone(p) { return { B: p.B, S: [...p.S], p: [...p.p] }; }

// ---------- flow drawing ----------
const W = 1536, BOX_W = 316, BOX_H = 142, BOX_Y = 78;
const MX = [150, 610, 1070];
const BUF = [MX[0] + BOX_W + 72, MX[1] + BOX_W + 72];
const LINE_Y = BOX_Y + BOX_H / 2;
const BAR = { x: 18, y: 112, w: BOX_W - 36, h: 14 };
const NS = "http://www.w3.org/2000/svg";
let svg, pulseLayer;

function buildFlow() {
  const flow = $("flow");
  flow.textContent = "";
  svg = document.createElementNS(NS, "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", 242);
  let s = `<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#8E9BB0" stroke-width="2"/></marker></defs>`;
  s += `<text class="side" x="0" y="${LINE_Y - 14}">Raw wafers</text>`;
  s += `<path class="wire" d="M0 ${LINE_Y} H${MX[0] - 8}" marker-end="url(#arr)"/>`;
  for (let k = 0; k < 2; k++) {
    const c = BUF[k];
    s += `<path class="wire" d="M${MX[k] + BOX_W} ${LINE_Y} H${c - 46}" marker-end="url(#arr)"/>`;
    s += `<path class="wire" d="M${c + 46} ${LINE_Y} H${MX[k + 1] - 8}" marker-end="url(#arr)"/>`;
    s += `<polygon class="buf" points="${c},${LINE_Y - 44} ${c - 42},${LINE_Y + 34} ${c + 42},${LINE_Y + 34}"/>`;
    s += `<text class="bufn" id="buf${k}" x="${c}" y="${LINE_Y + 24}" text-anchor="middle">0</text>`;
  }
  s += `<path class="wire" d="M${MX[2] + BOX_W} ${LINE_Y} H${W - 60}" marker-end="url(#arr)"/>`;
  s += `<text class="siden" id="doneN" x="${W}" y="${LINE_Y - 12}" text-anchor="end">0</text>`;
  s += `<text class="side" x="${W}" y="${LINE_Y + 28}" text-anchor="end">finished</text>`;
  for (let j = 0; j < 3; j++) {
    const x = MX[j];
    const xc = x + BOX_W / 2;
    [["Target", "capT", 24], ["Actual", "capA", 54]].forEach(([lab, id, yy]) => {
      s += `<text class="mcap" x="${xc - 18}" y="${yy}" text-anchor="end">${lab}</text>`;
      s += `<text class="mcap" id="${id}${j}" x="${xc + 58}" y="${yy}" text-anchor="end"></text>`;
      s += `<text class="mcap" x="${xc + 66}" y="${yy}">wafers/h</text>`;
    });
    s += `<rect class="mach" id="box${j}" x="${x}" y="${BOX_Y}" width="${BOX_W}" height="${BOX_H}" rx="10"/>`;
    s += `<text class="mname" x="${x + 18}" y="${BOX_Y + 38}">${STEPS[j]}</text>`;
    s += `<text class="mstate" id="state${j}" x="${x + 18}" y="${BOX_Y + 76}">Idle</text>`;
    s += `<rect id="trS${j}" x="${x + BAR.x}" y="${BOX_Y + BAR.y}" height="${BAR.h}" rx="3" fill="var(--setup-tint)"/>`;
    s += `<rect id="trP${j}" y="${BOX_Y + BAR.y}" height="${BAR.h}" rx="3" fill="var(--proc-tint)"/>`;
    s += `<rect id="pgS${j}" x="${x + BAR.x}" y="${BOX_Y + BAR.y}" height="${BAR.h}" rx="3" fill="var(--setup)"/>`;
    s += `<rect id="pgP${j}" y="${BOX_Y + BAR.y}" height="${BAR.h}" rx="3" fill="var(--blue)"/>`;
  }
  s += `<g id="pulses" class="pulse"></g>`;
  svg.innerHTML = s;
  flow.append(svg);
  pulseLayer = svg.querySelector("#pulses");
  for (let j = 0; j < 3; j++) {
    const box = document.createElement("div");
    box.className = "inputs";
    Object.assign(box.style, { left: MX[j] + "px", top: (BOX_Y + BOX_H + 22) + "px", width: BOX_W + "px" });
    box.append(fieldFor(`S${j}`, "Setup", "min", 4, 5), fieldFor(`p${j}`, "Per wafer", "min", 5, 0.05));
    flow.append(box);
  }
}

function fieldFor(key, label, unit, w, step) {
  const f = document.createElement("label");
  f.className = "field"; f.id = "f-" + key;
  const inp = document.createElement("input");
  Object.assign(inp, { id: "in-" + key, type: "text", inputMode: "decimal" });
  inp.dataset.step = step;
  inp.style.width = (w + 1.2) + "ch";
  const ctl = document.createElement("span"); ctl.className = "ctl"; ctl.append(inp, unit);
  const l = document.createElement("span"); l.textContent = label;
  f.append(l, ctl);
  return f;
}

// ---------- state, inputs and presets ----------
let line, running = false, raf = 0, lastFrame = 0, lastUi = 0, speed = 30, history = [], nextSample = 0, pulses = [], fast = false;

function getVal(key) { return key === "B" ? par.B : par[key[0]][+key[1]]; }
function setVal(key, v) { if (key === "B") par.B = v; else par[key[0]][+key[1]] = v; }
function baseVal(key) { return key === "B" ? BASE.B : BASE[key[0]][+key[1]]; }
const KEYS = ["B", "S0", "p0", "S1", "p1", "S2", "p2"];

function syncInputs() {
  for (const k of KEYS) {
    const inp = $("in-" + k);
    if (document.activeElement !== inp) inp.value = String(getVal(k));
    $("f-" + k).classList.toggle("changed", getVal(k) !== baseVal(k));
  }
  const isNew = par.S[0] === NEW_DEP.S && par.p[0] === NEW_DEP.p;
  const isOld = par.S[0] === BASE.S[0] && par.p[0] === BASE.p[0];
  document.querySelector('[data-tech="new"]').classList.toggle("active", isNew);
  document.querySelector('[data-tech="old"]').classList.toggle("active", isOld);
}

function valid() {
  return par.B >= 1 && Number.isInteger(par.B) && par.S.every((s, j) => s >= 0 && par.p[j] >= 0 && s + par.p[j] > 0);
}

function bindInputs() {
  for (const k of KEYS) {
    const inp = $("in-" + k);
    inp.addEventListener("keydown", e => {
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      e.preventDefault();
      const st = +inp.dataset.step * (e.shiftKey ? 10 : 1), cur = parseFloat(inp.value.replace(",", ".")) || 0;
      const nx = Math.max(k === "B" ? 1 : 0, +(cur + (e.key === "ArrowUp" ? st : -st)).toFixed(4));
      inp.value = String(nx); inp.dispatchEvent(new Event("input"));
    });
    inp.addEventListener("input", () => {
      const raw = inp.value.trim().replace(",", ".");
      const x = /^\d*\.?\d+$|^\d+\.$/.test(raw) ? parseFloat(raw) : NaN;
      const bad = !Number.isFinite(x) || x < 0 || (k === "B" && (x < 1 || !Number.isInteger(x)));
      inp.classList.toggle("bad", bad);
      if (bad) return;
      setVal(k, x);
      if (!valid()) { inp.classList.add("bad"); return; }
      restart();
    });
    $("f-" + k).addEventListener("click", e => { if (e.target !== inp) inp.focus(); });
  }
  document.querySelectorAll("[data-tech]").forEach(b => b.addEventListener("click", () => {
    const src = b.dataset.tech === "new" ? NEW_DEP : { S: BASE.S[0], p: BASE.p[0] };
    par.S[0] = src.S; par.p[0] = src.p;
    restart();
  }));
}

function onMove(j, dir, id) {
  if (fast) return;
  const from = dir === "out" ? MX[j] + BOX_W : (j === 1 ? BUF[0] : BUF[1]) + 44;
  const to = dir === "out" ? (j < 2 ? BUF[j] - 44 : MX[2] + BOX_W + 70) : MX[j];
  pulses.push({ from, to, birth: performance.now() });
  if (pulses.length > 12) pulses.shift();
}

function restart() {
  line = new Line(clone(par), onMove);
  history = [{ t: 0, w: [0, 0] }]; nextSample = 10; pulses = [];
  syncInputs(); render(true);
}

// ---------- animation loop (structure follows the buffer simulator) ----------
function step(target) {
  line.advance(target);
  while (line.t >= nextSample) { history.push({ t: nextSample, w: [line.waiting(0), line.waiting(1)] }); nextSample += 10; }
  if (history.length > 2000) history = history.filter((_, i) => i % 2 === 0);
  line.prune(line.t - 8 * 60 - 1);
}
function frame(now) {
  if (!running) return;
  if (raf) cancelAnimationFrame(raf);
  const dt = Math.min(0.25, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  step(line.t + dt * speed);
  if (now - lastUi > 50) { render(); lastUi = now; }
  raf = requestAnimationFrame(frame);
}
// The timer keeps the clock running where animation frames are throttled.
let watchdog = 0;
function start() {
  if (running) return;
  running = true; lastFrame = performance.now(); $("play").textContent = "Pause";
  raf = requestAnimationFrame(frame);
  watchdog = setInterval(() => { if (running && performance.now() - lastFrame > 150) frame(performance.now()); }, 100);
}
function pause() {
  running = false; if (raf) cancelAnimationFrame(raf); raf = 0; clearInterval(watchdog);
  $("play").textContent = line && line.t > 0 ? "Resume" : "Start";
}
function plusDay() { fast = true; try { const target = line.t + 1440; while (line.t < target) step(Math.min(target, line.t + 30)); } finally { fast = false; } render(); }

// ---------- rendering ----------
function render() {
  const a = analytic(line.par), t = line.t;
  $("clock").textContent = t < 48 * 60 ? `${fmt(t / 60, 1)} h` : `Day ${fmt(t / 1440, 1)}`;
  for (let j = 0; j < 3; j++) {
    const x = line.m[j], S = line.par.S[j], P = line.par.B * line.par.p[j], tot = S + P;
    const box = $("box" + j), st = $("state" + j);
    let cls = "idle", text = "Idle, waiting for a batch";
    if (x.busy) {
      if (t < x.setupEnd) { cls = "setup"; text = `Setup, batch ${x.id}: ${fmt(t - x.start, 0)} of ${short(S)} min`; }
      else { cls = "processing"; text = `Batch ${x.id}: wafer ${Math.min(line.par.B, Math.floor((t - x.setupEnd) / line.par.p[j]) + 1)} of ${line.par.B}`; }
    }
    box.setAttribute("class", "mach " + cls + (a.bottleneck[j] ? " bottleneck" : ""));
    st.setAttribute("class", "mstate " + cls); st.textContent = text;
    const wS = tot > 0 ? BAR.w * S / tot : 0, x0 = MX[j] + BAR.x;
    $("trS" + j).setAttribute("width", wS); $("trP" + j).setAttribute("x", x0 + wS); $("trP" + j).setAttribute("width", BAR.w - wS);
    let doneS = 0, doneP = 0;
    if (x.busy) { doneS = Math.min(t, x.setupEnd) - x.start; doneP = Math.max(0, t - x.setupEnd); }
    $("pgS" + j).setAttribute("width", S > 0 ? wS * doneS / S : 0);
    $("pgP" + j).setAttribute("x", x0 + wS); $("pgP" + j).setAttribute("width", P > 0 ? (BAR.w - wS) * doneP / P : 0);
    $("capT" + j).textContent = fmt(a.cap[j], 1);
    $("capA" + j).textContent = fmt(line.actual(j), 1);
  }
  for (let k = 0; k < 2; k++) $("buf" + k).textContent = line.waiting(k).toLocaleString("en-US");
  $("doneN").textContent = (line.done * line.par.B).toLocaleString("en-US");
  const now = performance.now();
  pulses = pulses.filter(p => now - p.birth < 420);
  pulseLayer.innerHTML = pulses.map(p => {
    const u = Math.min(1, (now - p.birth) / 420), e = 1 - (1 - u) * (1 - u), x = p.from + (p.to - p.from) * e;
    return `<g opacity="${Math.sin(Math.PI * Math.min(1, u * 1.15)).toFixed(2)}"><rect x="${(x - 30).toFixed(1)}" y="${LINE_Y - 14}" width="60" height="28" rx="14"/><text x="${x.toFixed(1)}" y="${LINE_Y + 6}" text-anchor="middle">${line.par.B}</text></g>`;
  }).join("");
  renderTable(a);
  drawChart(a);
  drawGantt();
}

function renderTable(a) {
  const B = line.par.B;
  let rows = "";
  for (let j = 0; j < 3; j++) {
    const f = `60 × ${B} / (${short(line.par.S[j])} + ${short(B)} × ${short(line.par.p[j])}) = ${fmt(a.cap[j], 1)}`;
    rows += `<tr class="${a.bottleneck[j] ? "bn" : ""}"><td>${STEPS[j]}${a.bottleneck[j] ? " (bottleneck)" : ""}</td><td>${f}</td>` +
            `<td class="num">${fmt(line.actual(j), 1)}</td></tr>`;
  }
  rows += `<tr class="total"><td>Process</td><td>Smallest target = ${fmt(a.rate, 1)}</td>` +
          `<td class="num">Etching output: ${fmt(line.actual(2), 1)}</td></tr>`;
  $("tbody").innerHTML = rows;
}

function crisp(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * scale;
  const w = +canvas.dataset.w || canvas.width, h = +canvas.dataset.h || canvas.height;
  canvas.dataset.w = w; canvas.dataset.h = h;
  canvas.style.width = w + "px"; canvas.style.height = h + "px";
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const c = canvas.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { c, w, h };
}
const FONT = '"Plex Embedded", "IBM Plex Sans", system-ui, sans-serif';

function drawChart(a) {
  const { c, w, h } = crisp($("chart"));
  const m = { l: 56, r: 30, t: 12, b: 32 }, Wp = w - m.l - m.r, Hp = h - m.t - m.b;
  const tmax = Math.max(12 * 60, line.t);
  const peak = Math.max(line.par.B * 2, ...history.map(p => Math.max(p.w[0], p.w[1])), line.waiting(0), line.waiting(1));
  const unit = peak <= 400 ? 100 : peak <= 2000 ? 500 : 2500, ymax = Math.ceil(peak / unit) * unit;
  const X = t => m.l + t / tmax * Wp, Y = v => m.t + Hp - Math.min(v, ymax) / ymax * Hp;
  c.font = `18px ${FONT}`; c.fillStyle = "#1A1A1A"; c.textAlign = "right"; c.textBaseline = "middle";
  for (let i = 0; i <= 4; i++) {
    const v = ymax * i / 4; c.strokeStyle = "#E6EAF0"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(m.l, Y(v)); c.lineTo(w - m.r, Y(v)); c.stroke(); c.fillText(fmt(v, 0), m.l - 8, Y(v));
  }
  c.textAlign = "center"; c.textBaseline = "top";
  for (let i = 0; i <= 4; i++) { const t = tmax * i / 4; c.fillText(t < 2880 || tmax < 2880 ? `${fmt(t / 60, 0)} h` : `${fmt(t / 1440, 1)} d`, X(t), h - m.b + 8); }
  [["#4472C4", 0], ["#3F7A25", 1]].forEach(([col, k]) => {
    c.strokeStyle = col; c.lineWidth = 3; c.lineJoin = "round"; c.beginPath();
    history.forEach((p, i) => (i ? c.lineTo(X(p.t), Y(p.w[k])) : c.moveTo(X(p.t), Y(p.w[k]))));
    c.lineTo(X(line.t), Y(line.waiting(k)));
    c.stroke();
  });
}

function drawGantt() {
  const { c, w, h } = crisp($("gantt"));
  const L0 = 170, rowH = 30, gap = 10, top = 4, Wp = w - L0 - 4;
  const t1 = Math.max(8 * 60, line.t), t0 = t1 - 8 * 60;
  const X = t => L0 + (t - t0) / (t1 - t0) * Wp;
  const setupCol = "#C55A11", procCol = "#4472C4";
  c.font = `21px ${FONT}`; c.textBaseline = "middle"; c.textAlign = "left";
  for (let j = 0; j < 3; j++) {
    const y = top + j * (rowH + gap);
    c.fillStyle = "#1A1A1A"; c.fillText(STEPS[j], 0, y + rowH / 2);
    c.fillStyle = "#EEF1F5"; c.fillRect(L0, y, Wp, rowH);
    for (const s of line.segs[j]) {
      const a = Math.max(s.a, t0), b = Math.min(s.b, line.t);
      if (b <= a) continue;
      c.fillStyle = s.kind === "setup" ? setupCol : procCol;
      c.fillRect(X(a), y, Math.max(1, X(b) - X(a)), rowH);
    }
  }
  const yAxis = top + 3 * (rowH + gap) + 2;
  c.font = `18px ${FONT}`; c.fillStyle = "#1A1A1A"; c.textAlign = "center"; c.textBaseline = "top";
  for (let hr = Math.ceil(t0 / 60 - 1e-9); hr * 60 <= t1 + 1e-9; hr++) {
    const x = X(hr * 60);
    c.strokeStyle = "#8E9BB0"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, yAxis - 9); c.lineTo(x, yAxis - 2); c.stroke();
    c.fillText(`${hr} h`, Math.min(Math.max(x, L0 + 14), w - 22), yAxis);
  }
}

// ---------- fitting the stage to the window ----------
const stage = $("stage");
let scale = 1;
function fit() {
  stage.style.transform = "none";
  const sw = stage.offsetWidth, sh = stage.offsetHeight;
  scale = Math.min(innerWidth / sw, innerHeight / sh);
  const left = Math.max(0, (innerWidth - sw * scale) / 2);
  stage.style.transform = `translate(${left}px, 0) scale(${scale})`;
  if (line) render();
}

$("play").addEventListener("click", () => (running ? pause() : start()));
$("reset").addEventListener("click", () => { const was = running; pause(); restart(); if (was) start(); $("play").textContent = running ? "Pause" : "Start"; });
$("day").addEventListener("click", plusDay);
$("speed").addEventListener("change", e => { speed = +e.target.value; });
document.addEventListener("visibilitychange", () => { if (document.hidden && running) pause(); });
addEventListener("resize", fit);

function init() {
  buildFlow();
  bindInputs();
  restart();
  fit();
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(init);
</script>
